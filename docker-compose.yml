services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hrpulsar
      POSTGRES_USER: hrpulsar
      POSTGRES_PASSWORD: hrpulsar
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U hrpulsar
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6381}:6379"

volumes:
  pgdata:
