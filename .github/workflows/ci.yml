name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: hrpulsar_test
          POSTGRES_USER: hrpulsar
          POSTGRES_PASSWORD: hrpulsar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.test.txt', 'backend/ee/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        # ee/requirements.txt only exists in the monorepo (it's excluded
        # from the public sync). The conditional install keeps community
        # CI green while letting the monorepo pull in EE-only deps like
        # bleach + beautifulsoup4 needed by ee.blog.
        run: |
          cd backend
          pip install -r requirements.test.txt
          [ -f ee/requirements.txt ] && pip install -r ee/requirements.txt || true

      - name: Lint (ruff)
        run: cd backend && ruff check app/

      - name: Type check (mypy)
        run: cd backend && mypy app/ --ignore-missing-imports

      - name: Run tests
        run: cd backend && pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://hrpulsar:hrpulsar@localhost:5432/hrpulsar_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret

      # HRP-540: the suite above builds its schema with
      # Base.metadata.create_all, so it cannot see a model that drifted away
      # from its migrations. This step replays `alembic upgrade heads` into a
      # scratch database and diffs it against the models. It is marked
      # `migrations` and excluded from the default run to keep the unit
      # suite fast.
      - name: Schema drift guard (models vs migrations)
        run: cd backend && pytest tests/unit/test_schema_drift.py -m migrations -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://hrpulsar:hrpulsar@localhost:5432/hrpulsar_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: hrpulsar_test
          POSTGRES_USER: hrpulsar
          POSTGRES_PASSWORD: hrpulsar
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt', 'backend/ee/requirements.txt') }}
          restore-keys: pip-

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          [ -f ee/requirements.txt ] && pip install -r ee/requirements.txt || true

      - name: Set deployment mode
        # saas only when the EE package is present (monorepo / enterprise CI);
        # community builds run e2e in the default onprem mode.
        run: |
          if [ -d backend/ee ]; then
            echo "DEPLOYMENT_MODE=saas" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_MODE=onprem" >> "$GITHUB_ENV"
          fi

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Enable pgvector extension
        run: PGPASSWORD=hrpulsar psql -h localhost -U hrpulsar -d hrpulsar_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Run database migrations
        run: cd backend && alembic upgrade heads
        env:
          DATABASE_URL: postgresql+asyncpg://hrpulsar:hrpulsar@localhost:5432/hrpulsar_test

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100/api
          # i18n F7 (HRP-481): e2e runs the multi-locale deployment shape.
          # DEFAULT_LOCALE stays en so text matchers keep asserting the
          # default-locale strings.
          NEXT_PUBLIC_AVAILABLE_LOCALES: de,en
          NEXT_PUBLIC_DEFAULT_LOCALE: en

      - name: Start backend
        run: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8100 &
        env:
          DATABASE_URL: postgresql+asyncpg://hrpulsar:hrpulsar@localhost:5432/hrpulsar_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          E2E_MODE: "true"
          AVAILABLE_LOCALES: de,en
          DEFAULT_LOCALE: en

      - name: Start celery worker + beat
        # -B runs the beat scheduler in-process, so the
        # write_celery_heartbeat task (every 30s) keeps /health green.
        run: cd backend && celery -A app.core.celery_app worker -B --loglevel=warning --concurrency=1 &
        env:
          DATABASE_URL: postgresql+asyncpg://hrpulsar:hrpulsar@localhost:5432/hrpulsar_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          E2E_MODE: "true"
          AVAILABLE_LOCALES: de,en
          DEFAULT_LOCALE: en

      - name: Start frontend
        run: cd frontend && npm start -- --port 3100 &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100/api
          NEXT_PUBLIC_AVAILABLE_LOCALES: de,en
          NEXT_PUBLIC_DEFAULT_LOCALE: en

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          # 90s window: celery beat heartbeats at 30s, allow a couple of cycles.
          timeout 90 bash -c 'until curl -sf http://localhost:8100/health; do sleep 1; done'
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3100; do sleep 1; done'

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          CI: "true"
          # Same value as the servers — MULTI_LOCALE_E2E in helpers.ts
          # gates the locale-select/switcher assertions on it.
          AVAILABLE_LOCALES: de,en

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Public repo only: tag release commits and publish a GitHub Release.
  # Fires on the synced `release: vX.Y.Z` commits and on the `init: … vX.Y.Z`
  # commit a history restart produces, after the test jobs are green.
  release-tag:
    if: >-
      github.repository == 'hrpulsar/hrpulsar' &&
      github.event_name == 'push' &&
      (startsWith(github.event.head_commit.message, 'release: v') ||
       startsWith(github.event.head_commit.message, 'init: '))
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env on purpose: interpolating the commit message
          # straight into the script would be a shell-injection vector.
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version=$(printf '%s\n' "$HEAD_MESSAGE" | head -1 \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$version" ]; then
            echo "No vX.Y.Z in the head commit message — nothing to tag."
            exit 0
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists — skipping."
            exit 0
          fi
          # Release notes: this version's section from CHANGELOG.md.
          awk -v ver="${version#v}" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md || true
          if ! [ -s /tmp/notes.md ]; then
            echo "See CHANGELOG.md for details." > /tmp/notes.md
          fi
          gh release create "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes-file /tmp/notes.md
